<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173e34"><link rel="manifest" href="manifest.webmanifest"><title>Book Words</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#19382f;background:#f4f7f4}body{margin:0;padding:16px 14px 90px}main{max-width:520px;margin:auto}h1{font-size:26px;margin:8px 0}header{display:flex;justify-content:space-between;align-items:center}.subtitle,.muted{color:#63766f;font-size:13px}.card{background:white;border:1px solid #dfe8e1;border-radius:20px;padding:20px;margin-top:15px;box-shadow:0 3px 15px #183b2a0a}.word{text-align:center;font-size:29px;line-height:1.3;margin:28px 0}.pill{font-size:12px;background:#e9f2e9;padding:6px 10px;border-radius:50px;display:inline-block}.line{border-top:1px solid #edf1ee;margin:20px 0}.btn{border:0;border-radius:12px;background:#1a6651;color:white;padding:13px 14px;font-size:15px;cursor:pointer}.secondary{background:#edf3ef;color:#1e5847}.full{width:100%;margin-top:10px}.row{display:flex;gap:8px}.row>*{flex:1}.center{text-align:center}.meaning{font-size:21px;font-weight:700;text-align:center}.sentence{line-height:1.8}.dots{display:flex;gap:8px;margin:12px 0}.dots button{flex:1;padding:13px 0;border-radius:10px;border:1px solid #cddfd4;background:white;color:#516a5e;font-size:17px}.dots .on{background:#dbf2e4;color:#20744e;border-color:#86bf9f}textarea{box-sizing:border-box;width:100%;min-height:125px;border-radius:12px;border:1px solid #cedbd0;padding:10px;font-size:14px}nav{display:flex;gap:7px;margin-top:14px}nav button{flex:1}section{display:none}section.active{display:block}.item{border-bottom:1px solid #edf1ee;padding:13px 0}.item:last-child{border:0}small{color:#647970}button:disabled{opacity:.45}.error{color:#ad3a28}.success{color:#1b734b}input[type=file]{max-width:100%}</style></head><body><main><header><div><h1>Book Words</h1><div class="subtitle">本の物語と一緒に、言葉を覚える。</div></div><div class="pill" id="stats">0語 学習中</div></header><nav><button class="btn" data-tab="study">復習</button><button class="btn secondary" data-tab="import">取り込み</button><button class="btn secondary" data-tab="archive">卒業済み</button></nav><section id="study" class="active"><div class="card" id="studyCard"><p class="center muted">まだ単語がありません。「取り込み」から登録してください。</p></div></section><section id="import"><div class="card"><b style="font-size:18px">単語を登録</b><p class="muted">ChatGPTのJSONをコピーして、下の欄を長押しして「ペースト」。登録した単語はこのiPhone内に保存されます。</p><textarea id="payload" placeholder="ここを長押し → ペースト" aria-label="ChatGPTのJSON" style="min-height:150px"></textarea><button class="btn full" id="importBtn">登録</button><p id="importMessage" class="muted" aria-live="polite"></p></div></section><section id="archive"><div class="card"><b>卒業済み</b><div id="archiveItems"></div></div></section><p class="muted center">復習回数はこの端末だけに保存されます。</p></main><script>
const DB='book-words-v1',STORE='vocabulary'; let records=[],index=0,reveal=false,showSentence=false; const $=id=>document.getElementById(id); const esc=s=>String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function openDB(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE,{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};async function all(){const db=await openDB();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readonly'),q=t.objectStore(STORE).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);t.oncomplete=()=>db.close()})}async function putMany(items){const db=await openDB();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readwrite');items.forEach(it=>t.objectStore(STORE).put(it));t.oncomplete=()=>{db.close();ok()};t.onerror=()=>no(t.error)})}function active(){return records.filter(x=>x.count<5)};function resetView(){reveal=false;showSentence=false}async function reload(){records=await all();records.sort((a,b)=>a.added.localeCompare(b.added));const a=active();if(index>=a.length)index=0;$('stats').textContent=`${a.length}語 学習中`;render()}function render(){let a=active(),r=a[index];if(!r){$('studyCard').innerHTML='<p class="center muted">学習中の単語はありません。<br>「取り込み」から追加できます。</p>'}else{$('studyCard').innerHTML=`<div class="row"><span class="pill">${esc(r.type==='idiom'?'Idiom':'Word')}</span><span class="muted" style="text-align:right">復習 ${r.count}/5</span></div><div class="word">${esc(r.term)}</div><p class="center muted">この意味、わかるかな？</p>${reveal?`<div class="line"></div><div class="meaning">${esc(r.meaning)}</div>`:''}<button class="btn full" id="toggleMeaning">${reveal?'意味を隠す':'意味を表示する'}</button>${showSentence?`<div class="line"></div><p class="sentence">${esc(r.sentence)}</p><p class="muted">${esc(r.translation)}</p><p class="muted">📖 ${esc(r.book)}</p>`:''}<button class="btn secondary full" id="toggleSentence">${showSentence?'原文を閉じる':'本の英文を表示する'}</button><div class="line"></div><small>復習チェック（5回で卒業）</small><div class="dots">${[1,2,3,4,5].map(n=>`<button data-count="${n}" class="${n<=r.count?'on':''}">${n<=r.count?'✓':n}</button>`).join('')}</div><button class="btn secondary full" id="next">次の単語 →</button>`;$('toggleMeaning').onclick=()=>{reveal=!reveal;render()};$('toggleSentence').onclick=()=>{showSentence=!showSentence;render()};$('next').onclick=()=>{index=(index+1)%a.length;resetView();render()};document.querySelectorAll('[data-count]').forEach(b=>b.onclick=async()=>{r.count=Number(b.dataset.count);r.updated=new Date().toISOString();await putMany([r]);resetView();await reload()})}const graduated=records.filter(x=>x.count>=5);$('archiveItems').innerHTML=graduated.length?graduated.map(r=>`<div class="item"><b>${esc(r.term)}</b><div><small>${esc(r.meaning)} — ${esc(r.book)}</small></div><button class="btn secondary" data-restore="${esc(r.id)}" style="margin-top:8px">復習に戻す</button></div>`).join(''):'<p class="muted">卒業した単語はまだありません。</p>';document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{const r=records.find(x=>x.id===b.dataset.restore);if(r){r.count=4;r.updated=new Date().toISOString();await putMany([r]);await reload()}})}
function parseItems(obj){let xs=Array.isArray(obj)?obj:obj.items;if(!Array.isArray(xs))throw Error('items配列がありません');return xs.map(x=>{if(!x.id||!x.term||!x.meaning||!x.sentence||!x.translation||!x.book)throw Error('必須項目(id,term,meaning,sentence,translation,book)が足りません');return {id:String(x.id),book:String(x.book),type:x.type==='idiom'?'idiom':'word',term:String(x.term),meaning:String(x.meaning),sentence:String(x.sentence),translation:String(x.translation),count:0,added:new Date().toISOString(),updated:new Date().toISOString()}})}$('importBtn').onclick=async()=>{const b=$('importBtn'),m=$('importMessage');try{const text=$('payload').value.trim();if(!text)throw Error('JSONを貼り付けてください');const xs=parseItems(JSON.parse(text));if(xs.length<1||xs.length>100)throw Error('一度に登録できるのは1〜100件です');b.disabled=true;const known=new Set(records.map(x=>x.id));const unique=new Map(xs.map(x=>[x.id,x]));const fresh=[...unique.values()].filter(x=>!known.has(x.id));await putMany(fresh);await reload();m.className='success';m.textContent=`登録 ${fresh.length}件／重複 ${xs.length-fresh.length}件。復習回数は維持しました。`;$('payload').value=''}catch(e){m.className='error';m.textContent='登録できません: '+e.message}finally{b.disabled=false}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab));document.querySelectorAll('[data-tab]').forEach(v=>v.className='btn '+(v===b?'':'secondary'))});reload().catch(e=>alert('保存領域を利用できません: '+e.message));if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script></body></html>
